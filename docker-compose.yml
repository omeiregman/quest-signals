services:
  quest:
    build: .
    image: quest
    ports:
      - '8787:8787'
    volumes:
      # SQLite database persists on the host across restarts.
      - ./data:/app/data
    env_file:
      # Optional: create .env (copy .env.example) to set ODDS_API_KEY etc.
      - path: .env
        required: false
    environment:
      - PORT=8787
      # Pin the container paths so a dev-oriented .env (DATABASE_URL=./data/...) can't
      # redirect the DB outside the mounted volume or hide the built web app.
      - DATABASE_URL=/app/data/quest.sqlite
      - WEB_DIST=/app/apps/web/dist
    restart: unless-stopped
